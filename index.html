<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17-113室の施錠状態モニターシステム</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
    .card { display: inline-block; padding: 30px; border-radius: 12px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
    .status { font-size: 2em; font-weight: bold; margin: 20px 0; padding: 15px 25px; border-radius: 8px; }
    .unlocked { color: #1e7e34; background: #d4edda; }
    .locked { color: #bd2130; background: #f8d7da; }
    .info { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="card">
    <h2>17-113室の施錠状態</h2>
    <div id="status" class="status">読み込み中...</div>
    <p class="info">アナログ値: <span id="val">-</span> / 4095</p>
    <p class="info">最終更新: <span id="time">-</span></p>
    <p class="info" style="margin-top: 15px; font-size: 0.85em; color: #888;">
      ※部屋の照明（明るさ）から自動で施錠状態を判定しています。誤作動する可能性があるため、参考程度にご利用ください。
    </p>
  </div>

  <script>
    // FirebaseのURL（末尾は /status.json）
    const FIREBASE_URL = "https://lock-state-visualizer-default-rtdb.firebaseio.com/status.json";

    // ★ 点灯時と消灯時の「中間値」を設定してください（例: 1000）
    const THRESHOLD = 1000;

    function updateStatus() {
      fetch(FIREBASE_URL)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          const statusEl = document.getElementById('status');
          const val = Number(data.analogValue); // ESP32から送られてくる生の値

          document.getElementById('val').innerText = val;
          document.getElementById('time').innerText = new Date().toLocaleTimeString();

          // ★ 判定ロジック
          // 3.3V - CdS - GPIO - 2.2kΩ - GND の回路では、暗い（消灯）時に数値が小さくなります。
          // 閾値（THRESHOLD）より数値が小さければ「施錠（消灯）」と判定します。
          const isLocked = (val < THRESHOLD);

          if (isLocked) {
            statusEl.innerText = "🔒 施錠中";
            statusEl.className = "status locked";
          } else {
            statusEl.innerText = "🔓 解錠中";
            statusEl.className = "status unlocked";
          }
        })
        .catch(err => console.error("データ取得エラー:", err));
    }

    // 2秒ごとに画面の数値を更新
    setInterval(updateStatus, 2000);
    updateStatus();
  </script>
</body>
</html>
